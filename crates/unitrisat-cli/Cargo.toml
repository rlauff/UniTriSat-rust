[package]
name = "unitrisat-cli"
default-run = "unitrisat"
description = "File-based exact polytope triangulation searches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "unitrisat"
path = "src/main.rs"
doc = false

[[bin]]
name = "unitrisat-julia"
path = "src/bin/unitrisat-julia.rs"
doc = false

[lints]
workspace = true

[features]
default = []
cuda = ["unitrisat/cuda"]

[dependencies]
ctrlc = "=3.5.2"
tempfile = "=3.25.0"
same-file = "=1.0.6"
rayon = "=1.12.0"
terminal_size = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
clap = { version = "=4.6.1", features = ["derive"] }
sha2 = { version = "=0.10.9", default-features = false }
thiserror = "=2.0.21"
unitrisat = { path = "../unitrisat", features = ["cli"] }
