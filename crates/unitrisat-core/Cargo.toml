[package]
name = "unitrisat-core"
description = "Exact unimodular triangulation search for lattice polytopes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rug = { workspace = true, features = ["integer", "rational"] }
rayon = "=1.12.0"
thiserror = "=2.0.21"
unitrisat-cadical = { path = "../unitrisat-cadical" }
unitrisat-cdd = { path = "../unitrisat-cdd" }
unitrisat-picosat = { path = "../unitrisat-picosat" }

# The selected Kissat source is bundled; no build-time git checkout is needed.
# Upstream does not support Windows, where selecting Kissat returns an error.
[target.'cfg(not(windows))'.dependencies]
rustsat = { version = "=0.7.5", default-features = false }
rustsat-kissat = { version = "=0.7.5", default-features = false, features = ["quiet", "safe", "v4-0-4"] }

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false }
proptest = "=1.9.0"
rayon = "=1.12.0"

[[bench]]
name = "stages"
harness = false
