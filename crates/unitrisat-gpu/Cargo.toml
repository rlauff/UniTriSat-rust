[package]
name = "unitrisat-gpu"
description = "Optional exact CUDA intersection with automatic CPU fallback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
cuda = ["dep:cudarc"]

[dependencies]
unitrisat = { package = "unitrisat-core", path = "../unitrisat-core" }
cudarc = { version = "=0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13000"] }
