# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# GPL-3.0-only workspace. Every listed license is GPL-3.0 compatible.
allow = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list anticipates later dependencies; unused entries are fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies (all crates are publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
